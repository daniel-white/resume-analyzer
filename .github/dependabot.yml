version: 2
updates:
  # Keep GitHub Actions pins current so dependencies and runners get security
  # fixes. Pinned SHA commits are reviewed manually before bumping.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Keep the flake nixpkgs input current. The rust toolchain and Node/pnpm
  # come from flake.lock, so a nixpkgs bump changes the devShell toolchain.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "nix"

  # Docker base images referenced by digest in Dockerfile / Dockerfile.web.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "docker"
