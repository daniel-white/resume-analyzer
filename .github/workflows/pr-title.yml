name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronized]

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
          allowRevertPRs: true
          allowCustomScopes: true
          truncateLength: 72
