name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: gate
        run: ./scripts/check.sh
