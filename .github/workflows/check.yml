name: check

on:
  # Only main needs a push-triggered run. On PR branches the push event would
  # duplicate the pull_request run for the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Belt and braces with .cargo/config.toml: every rustc invocation in this
  # workflow fails on warnings, including steps added later.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume -d resume"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://resume:resume@localhost:5432/resume
      CI_IMAGE: resume-analyzer/ci:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: set up buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Rust, Node, pnpm, Helm, and the test tools all come from the flake.
      # The key is input-only so a lockfile change restores the closest store.
      - name: cache nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Build the pinned CI environment image (Dockerfile.ci) with GHA layer
      # caching. Strict checks run inside this image to reduce host dependency
      # conflicts; behavior checks run on the runner where docker/minikube access
      # may be required by demo/factory gates. CACHE_GHA is an opt-in flag shared
      # by all bake targets, so image caching is configured in one place.
      - name: build ci image
        env:
          CACHE_GHA: "true"
          CACHE_WRITE: "true"
        run: |
          ./scripts/bake.sh --load \
            --var "TAG=local" \
            --var "CACHE_GHA=${CACHE_GHA}" \
            --var "CACHE_WRITE=${CACHE_WRITE}" \
            ci
      # Warning-free is a named, fail-fast step: rustc + cargo clippy (pedantic
      # and cargo groups), tsc with the strict tsconfig, and helm lint --strict.
      - name: strict - no warnings (rust, cargo, typescript, helm)
        run: |
          docker run --rm --network host \
            -v "$PWD:/workspace" -w /workspace \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -v "$HOME/.local/share/pnpm/store:/root/.local/share/pnpm/store" \
            -e DATABASE_URL -e CARGO_TERM_COLOR -e RUSTFLAGS -e CI=true \
            "${CI_IMAGE}" \
            bash -lc 'git config --global --add safe.directory /workspace && nix develop .#default --command ./scripts/check.sh strict'
      - name: gate - tests, e2e, factory, demo
        run: nix develop --command ./scripts/check.sh behavior
