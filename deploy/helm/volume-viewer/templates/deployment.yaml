apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-dashboard
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
    spec:
      containers:
        - name: kubernetes-dashboard
          image: ghcr.io/kubernetes-dashboard/dashboard:v0.16.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          args:
            - --namespace-local-storage
            - --namespace-default=localstack
