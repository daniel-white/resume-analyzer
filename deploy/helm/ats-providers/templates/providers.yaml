{{- range .Values.providers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ . }}
  labels:
    app: {{ . }}
    app.kubernetes.io/name: ats-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ . }}
  template:
    metadata:
      labels:
        app: {{ . }}
        app.kubernetes.io/name: ats-providers
    spec:
      automountServiceAccountToken: false
      containers:
        - name: provider
          image: {{ $.Values.image }}
          imagePullPolicy: {{ $.Values.pullPolicy }}
          command: ["python", "-m", "providers"]
          args:
            - {{ . | quote }}
            - --cluster
            - --bind
            - 0.0.0.0
            - --port
            - {{ $.Values.port | quote }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          env:
            - name: PLUGIN_SECRET
              value: {{ $.Values.secret | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}
  labels:
    app: {{ . }}
    app.kubernetes.io/name: ats-providers
spec:
  type: ClusterIP
  selector:
    app: {{ . }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
---
{{- end }}
