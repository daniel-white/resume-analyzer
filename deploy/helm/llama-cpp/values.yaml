# The official llama.cpp server image, published on GHCR. It IS the server
# (entrypoint /app/llama-server) and speaks the OpenAI chat completions API
# on :8080. Verified end-to-end against a live model: /v1/chat/completions
# returns choices[0].message.content exactly as the worker expects.
# ggml-org/llama.cpp does not exist on Docker Hub - only on GHCR.
image: ghcr.io/ggml-org/llama.cpp:server
pullPolicy: IfNotPresent

# The GGUF is baked into the model-llama image (Dockerfile.model-llama, bake
# target model-llama). The llama-cpp pod mounts that OCI image read-only as a
# volume via .spec.volumes[].image, so the server sees the model at
# /models/llama-3.2-3b-instruct-q4_k_m.gguf with no initContainer and no PVC.
# Loaded into Minikube by scripts/up.sh (docker save | minikube image load)
# so containerd has the image locally; pullPolicy Never avoids a registry pull.
modelImage: resume-analyzer/model-llama:dev
modelImagePullPolicy: Never

# The GGUF filename is also the model the server loads. Must match the
# model name the resume-analyzer chart hands the API.
model: llama-3.2-3b-instruct-q4_k_m.gguf
dir: /models

# Total KV-cache pool, shared across all parallel slots (kv-unified).
# Sized as parallel * perSlotContext so every slot can run at its cap at once.
# At f16 a 3B Llama costs ~112 KiB/token, so 16384 tokens is roughly 1.75 GiB
# on top of the ~2 GiB of model weights. The old value of 2048 was one pool
# shared by four slots: any request could start, but the slots collectively
# overcommitted it, and decode then failed and tore down every active request.
context: 16384

# Concurrent requests llama.cpp will serve. Extra HTTP requests wait for a
# free slot instead of being rejected.
parallel: 4

# Hard per-request cap. A prompt larger than this is rejected before it is
# admitted, with a clear "exceeds the available context size" error, rather
# than failing mid-decode and taking the other slots down with it. Must be
# <= context / parallel (the pool is sized to parallel * perSlotContext).
perSlotContext: 4096

# Logical and physical batch sizes. Keeping both at 512 means a decode never
# asks the KV pool for more than 512 cells at once. The old logical default
# (2048) matched the entire pool, so one oversized prefill failed the whole
# server; smaller batches also make llama.cpp's "retry with a smaller batch"
# fallback take far fewer attempts.
batch: 512
ubatch: 512
