# The GGUF is baked into the model image (Dockerfile.model-llama, bake target
# model-llama). The llama-cpp pod mounts that OCI image read-only as a volume,
# so the server sees the GGUF at /models/<model>.gguf with no initContainer,
# no PVC, and no copy step.
#
# Image volumes (.spec.volumes[].image) need two things:
#   * the ImageVolume feature gate (BETA, default=false on K8s 1.34) enabled
#     on both kube-apiserver and kubelet;
#   * a CRI runtime that can mount an OCI image as a volume. containerd 2.x
#     supports it; the docker/cri-dockerd runtime does not.
# scripts/cluster.sh starts minikube with --container-runtime=containerd and
# sets the gate on both components.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      containers:
        - name: llama-cpp
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: 8080
          # --host 0.0.0.0 is required because the default is 127.0.0.1 and
          # the Service reaches the pod by pod IP. -ngl 0 keeps the 3B model
          # on CPU, where it answers in well under a second. GET /health
          # returns 200 {"status":"ok"} once the model is loaded and 503
          # while it is still loading, which the readinessProbe below treats
          # as "not ready" - the image volume guarantees the GGUF is present
          # before the container starts, so the server never exits for a
          # missing model.
          args:
            - -m
            - {{ .Values.dir }}/{{ .Values.model }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - {{ .Values.context | default 16384 | quote }}
            # One unified KV pool shared by all slots, with a hard per-slot
            # cap. -np is explicit, so -kvu is too: otherwise llama.cpp only
            # defaults to unified when the slot count is auto.
            - -np
            - {{ .Values.parallel | default 4 | quote }}
            - -kvu
            - --kv-unified-per-slot
            - {{ .Values.perSlotContext | default 4096 | quote }}
            # Cap the tokens submitted per decode. A 2048-token batch could
            # equal the whole old pool and make one request fatal for all.
            - -b
            - {{ .Values.batch | default 512 | quote }}
            - -ub
            - {{ .Values.ubatch | default 512 | quote }}
            - -ngl
            - "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: llama-cpp-models
              mountPath: {{ .Values.dir }}
              readOnly: true
      volumes:
        - name: llama-cpp-models
          image:
            reference: {{ .Values.modelImage }}
            pullPolicy: {{ .Values.modelImagePullPolicy }}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
