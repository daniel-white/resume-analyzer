{{- if and .Values.gateway.enabled .Values.gateway.mdns.enabled }}
# Announces the demo hostnames at the minikube node IP. hostNetwork is
# required, and it only reaches macOS Bonjour when the node is on the
# host's L2 domain (the vfkit driver). The docker driver will not.
{{- $ip := .Values.gateway.mdns.targetIp }}
{{- $publish := printf "avahi-publish-address -R app.resume.local %s &\navahi-publish-address -R tools.resume.local %s &\n" $ip $ip }}
{{- $script := printf "#!/bin/sh\nset -eu\napk add --no-cache avahi avahi-tools dbus >/dev/null\nmkdir -p /run/dbus\nrm -f /run/dbus/dbus.pid\ndbus-daemon --system --fork || true\ncat >/etc/avahi/avahi-daemon.conf <<'EOF'\n[server]\nallow-interfaces=eth0\ndeny-interfaces=lo\nuse-ipv4=yes\nuse-ipv6=no\nenable-dbus=yes\n[publish]\npublish-addresses=yes\npublish-hinfo=no\npublish-workstation=no\n[reflector]\nenable-reflector=no\nEOF\navahi-daemon --no-rlimits --daemonize || true\nfor i in 1 2 3 4 5; do avahi-daemon -c 2>/dev/null && break; sleep 1; done\nsleep 2\n%swait\n" $publish }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-analyzer-mdns
data:
  publish.sh: |
{{ $script | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-analyzer-mdns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-analyzer-mdns
  template:
    metadata:
      labels:
        app: resume-analyzer-mdns
      annotations:
        checksum/script: {{ $script | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: avahi
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/publish.sh"]
          volumeMounts:
            - name: script
              mountPath: /publish.sh
              subPath: publish.sh
              readOnly: true
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE", "NET_RAW"]
      volumes:
        - name: script
          configMap:
            name: resume-analyzer-mdns
            defaultMode: 0555
{{- end }}
