{{- if .Values.gateway.enabled }}
# Landing page served at tools.resume.local/ via Envoy Gateway's
# direct-response filter — no backend pod, just inline HTML on the proxy.
# Two resources:
#   * HTTPRouteFilter (gateway.envoyproxy.io/v1alpha1) — the response body
#     and content type.
#   * HTTPRoute matching exact path `/` and applying the filter via
#     ExtensionRef. The PathPrefix routes for /mail and /pgadmin are owned
#     by mailpit.yaml and pgadmin.yaml (each next to its backend Service)
#     and win for those paths because Gateway API ranks more-specific
#     matches first.
#
# Same pattern as the engops stack's tools landing page.
#
# Docs: https://gateway.envoyproxy.io/latest/tasks/traffic/direct-response/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ .Release.Name }}-tools-index
spec:
  directResponse:
    contentType: text/html
    body:
      type: Inline
      inline: |
        <!DOCTYPE html>
        <title>resume-analyzer tools</title>
        <h1>resume-analyzer tools</h1>
        <ul>
          <li><a href="/mail">Mailpit</a> — captured sign-in / analysis email</li>
          {{- if .Values.pgadmin.enabled }}
          <li><a href="/pgadmin">pgAdmin</a> — browse the Postgres database</li>
          {{- end }}
        </ul>
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-tools-index
spec:
  parentRefs:
    - name: resume-analyzer
      sectionName: tools
  hostnames:
    - tools.resume.local
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ .Release.Name }}-tools-index
{{- end }}