{{- if .Values.gateway.enabled }}
# One origin for the product so the session cookie stays first-party.
# Mailpit is a second name because its UI is part of the magic-link demo.
{{- if or .Values.web.enabled .Values.api.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: resume-analyzer
      sectionName: https
  hostnames:
    - app.resume.local
  rules:
    {{- if .Values.api.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: {{ .Values.api.port }}
    {{- end }}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: {{ .Values.web.port }}
    {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail
spec:
  parentRefs:
    - name: resume-analyzer
      sectionName: https
  hostnames:
    - mail.resume.local
  rules:
    - backendRefs:
        - name: mailpit
          port: 8025
{{- end }}
