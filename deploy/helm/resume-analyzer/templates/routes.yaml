{{- if .Values.gateway.enabled }}
# One origin for the product so the session cookie stays first-party.
# Dev tool UIs (Mailpit, pgAdmin) and their landing page live on the
# separate tools hostname — see tools-index.yaml, mailpit.yaml, and
# pgadmin.yaml.
{{- if or .Values.web.enabled .Values.api.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: resume-analyzer
      sectionName: https
  hostnames:
    - app.resume.local
  rules:
    {{- if .Values.api.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: {{ .Values.api.port }}
    {{- end }}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: {{ .Values.web.port }}
    {{- end }}
{{- end }}
{{- end }}
