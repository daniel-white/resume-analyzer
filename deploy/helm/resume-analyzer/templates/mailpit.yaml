apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - containerPort: 1025
            - containerPort: 8025
          env:
            # Serve the UI under /mail so it shares the tools hostname with
            # pgAdmin and the landing page. Mailpit prefixes every internal
            # URL and asset path with this value, so the HTTPRoute forwards
            # `/mail/*` verbatim — no Envoy URL rewrite needed.
            - name: MP_WEBROOT
              value: "/mail"
          readinessProbe:
            httpGet:
              path: /mail/readyz
              port: 8025
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
---
{{- if .Values.gateway.enabled }}
# Mailpit on the tools hostname: https://tools.resume.local/mail
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail
spec:
  parentRefs:
    - name: resume-analyzer
      sectionName: tools
  hostnames:
    - tools.resume.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mail
      backendRefs:
        - name: mailpit
          port: 8025
{{- end }}