{{- with index .Values "llama-cpp" }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      # Download the GGUF once into a shared emptyDir before the server
      # starts, so a fresh pod serves it without a download while a resume
      # uploads. llama.cpp serves the OpenAI chat completions API.
      # busybox is the fetch sidecar: it is tiny, already used by
      # Dockerfile.model, and its wget handles redirects and retries. It
      # cannot validate TLS, so the download skips certificate checks.
      initContainers:
        - name: fetch-model
          image: busybox:stable-musl
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eux
              mkdir -p /models
              wget --tries=3 --timeout=30 --no-check-certificate \
                -O "/models/{{ .model }}" "{{ .url }}"
          volumeMounts:
            - name: llama-cpp-models
              mountPath: /models
      # This image IS the llama.cpp server (entrypoint /app/llama-server); it
      # serves the OpenAI chat completions API on :8080. --host 0.0.0.0 is
      # required because the default is 127.0.0.1 and the Service reaches it by
      # pod IP. -ngl 0 keeps the 3B model on CPU, where it answers in well
      # under a second. GET /health returns 200 {"status":"ok"} once the model
      # is loaded and 503 while it is still loading, which the readinessProbe
      # below treats as "not ready" - the initContainer guarantees the GGUF is
      # present before this container starts, so the server never exits for a
      # missing model.
      containers:
        - name: llama-cpp
          image: {{ .image }}
          imagePullPolicy: {{ .pullPolicy }}
          ports:
            - containerPort: 8080
          args:
            - -m
            - /models/{{ .model }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "2048"
            - -ngl
            - "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: llama-cpp-models
              mountPath: /models
              readOnly: true
      volumes:
        - name: llama-cpp-models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
  labels:
    app: llama-cpp
  annotations:
    # Keep the downloaded GGUF across `helm uninstall`/`helm install` cycles
    # so a re-deploy does not force a ~2GB re-download.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .storage | default "3Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
{{- end }}
