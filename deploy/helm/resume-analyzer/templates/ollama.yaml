{{- with index .Values "llama-cpp" }}
{{- if .enabled }}
# The GGUF is baked into the model-llama image and loaded into the PVC by the
# Job below, so the server pod starts with the file already present and never
# downloads it. The image is the official llama.cpp server build; it serves
# the OpenAI chat completions API on :8080.
#
# Ordering is hook-based: the PVC is created first (weight 10), then the
# load-model Job runs (weight 20) and waits for it before the Deployment is
# created (weight 30). `helm install`/`helm upgrade --wait` blocks until the
# Job completes, so a fresh install does not start the server on an empty
# volume. The Job is restartable: `cp -n` skips an already-present file, so a
# re-deploy is a no-op rather than a re-download.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
  labels:
    app: llama-cpp
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .storage | default "3Gi" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-load-model
  labels:
    app: llama-cpp
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "20"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      restartPolicy: OnFailure
      containers:
        - name: load-model
          image: {{ .loadImage }}
          imagePullPolicy: {{ .loadPullPolicy }}
          command:
            - /bin/cp
            - -n
            - /model/{{ .model }}
            - {{ .dir }}/{{ .model }}
          volumeMounts:
            - name: llama-cpp-models
              mountPath: {{ .dir }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "30"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      # The server pod does not download anything. The load-model Job fills the
      # PVC first; the readinessProbe below waits until the model is loaded.
      containers:
        - name: llama-cpp
          image: {{ .image }}
          imagePullPolicy: {{ .pullPolicy }}
          ports:
            - containerPort: 8080
          args:
            - -m
            - {{ .dir }}/{{ .model }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "2048"
            - -ngl
            - "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: llama-cpp-models
              mountPath: {{ .dir }}
      volumes:
        - name: llama-cpp-models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
{{- end }}