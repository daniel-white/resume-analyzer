{{- with index .Values "llama-cpp" }}
{{- if .enabled }}
# The GGUF is baked into the model-llama image and loaded into the PVC by the
# load-model Job below, so the server pod starts with the file already present
# and never downloads it. The image is the official llama.cpp server build;
# it serves the OpenAI chat completions API on :8080.
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-load-model
  labels:
    app: llama-cpp
spec:
  # Restartable: re-run after a PVC swap or a failed download loads the GGUF
  # again without touching the server. A second run is a no-op when the file is
  # already present (cp -n skips it), so a re-deploy does not re-download.
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      restartPolicy: OnFailure
      containers:
        - name: load-model
          image: {{ .loadImage }}
          imagePullPolicy: {{ .loadPullPolicy }}
          command:
            - /bin/cp
            - -n
            - /model/{{ .model }}
            - {{ .dir }}/{{ .model }}
          volumeMounts:
            - name: llama-cpp-models
              mountPath: {{ .dir }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      # The server pod does not download anything. The load-model Job fills the
      # PVC first; the readinessProbe below waits until the model is loaded.
      containers:
        - name: llama-cpp
          image: {{ .image }}
          imagePullPolicy: {{ .pullPolicy }}
          ports:
            - containerPort: 8080
          args:
            - -m
            - {{ .dir }}/{{ .model }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "2048"
            - -ngl
            - "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: llama-cpp-models
              mountPath: {{ .dir }}
            {{- if .context }}
          resources:
            requests:
              cpu: {{ .context | quote }}
            {{- end }}
      volumes:
        - name: llama-cpp-models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
  labels:
    app: llama-cpp
  annotations:
    # Keep the downloaded GGUF across `helm uninstall`/`helm install` cycles
    # so a re-deploy does not force a ~2GB re-download.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .storage | default "3Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
{{- end }}