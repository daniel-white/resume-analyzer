{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Pull the model once into a shared emptyDir before the server starts,
      # so a fresh pod serves it without a download while a resume uploads.
      initContainers:
        - name: pull-model
          image: {{ .Values.ollama.image }}
          imagePullPolicy: {{ .Values.ollama.pullPolicy }}
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              {{- range .Values.ollama.models }}
              ollama pull "{{ . }}"
              {{- end }}
              pkill ollama
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          imagePullPolicy: {{ .Values.ollama.pullPolicy }}
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels:
    app: ollama
  annotations:
    # Keep the pulled model across `helm uninstall`/`helm install` cycles so a
    # re-deploy does not force a re-download.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.storage | default "2Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
{{- end }}