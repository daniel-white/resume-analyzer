{{- if .Values.llama-cpp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      # Download the GGUF once into a shared emptyDir before the server
      # starts, so a fresh pod serves it without a download while a resume
      # uploads. llama.cpp serves the OpenAI chat completions API.
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.14.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eux
              mkdir -p /models
              url="https://huggingface.co/ggml-org/llama3.2-3b-GGUF/resolve/main/{{ .Values.llama-cpp.model }}"
              curl --fail --location --retry 3 --retry-delay 2 \
                --output "/models/{{ .Values.llama-cpp.model }}" "$url"
          volumeMounts:
            - name: llama-cpp-models
              mountPath: /models
      containers:
        - name: llama-cpp
          image: {{ .Values.llama-cpp.image }}
          imagePullPolicy: {{ .Values.llama-cpp.pullPolicy }}
          ports:
            - containerPort: 8080
          args:
            - -m
            - /models/{{ .Values.llama-cpp.model }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "2048"
            - -ngl
            - "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: llama-cpp-models
              mountPath: /models
              readOnly: true
      volumes:
        - name: llama-cpp-models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
  labels:
    app: llama-cpp
  annotations:
    # Keep the downloaded GGUF across `helm uninstall`/`helm install` cycles
    # so a re-deploy does not force a ~2GB re-download.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.llama-cpp.storage | default "3Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
