{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- if .Values.sections.model.enabled }}
      initContainers:
        - name: section-model
          image: {{ .Values.sections.model.image }}
          imagePullPolicy: {{ .Values.sections.model.pullPolicy }}
          command:
            - /bin/cp
            - -R
            - /model/.
            - {{ .Values.sections.model.dir }}/
          volumeMounts:
            - name: section-model
              mountPath: {{ .Values.sections.model.dir }}
      {{- end }}
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: BIND
              value: 0.0.0.0:{{ .Values.api.port }}
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}
            - name: S3_ENDPOINT
              value: http://localstack:4566
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.s3.accessKey | quote }}
            - name: S3_SECRET_KEY
              value: {{ .Values.s3.secretKey | quote }}
            - name: SMTP_HOST
              value: mailpit
            - name: SMTP_PORT
              value: "1025"
            - name: APP_ORIGIN
              value: https://app.resume.local
            - name: AUTH_SECRET
              value: {{ .Values.auth.secret | quote }}
            {{- if .Values.api.providers }}
            - name: ATS_PROVIDERS
              value: {{ .Values.api.providers | quote }}
            {{- end }}
            {{- if .Values.api.callbackUrl }}
            - name: CALLBACK_URL
              value: {{ .Values.api.callbackUrl | quote }}
            {{- end }}
            {{- if .Values.api.pluginSecret }}
            - name: PLUGIN_SECRET
              value: {{ .Values.api.pluginSecret | quote }}
            {{- end }}
            {{- if .Values.sections.model.enabled }}
            - name: SECTION_MODEL
              value: "auto"
            - name: SECTION_MODEL_DIR
              value: {{ .Values.sections.model.dir | quote }}
            - name: SECTION_MODEL_NAME
              value: {{ .Values.sections.model.name | quote }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            - name: SUMMARY_MODEL
              value: "auto"
            - name: SUMMARY_MODEL_URL
              value: http://ollama:11434
            - name: SUMMARY_MODEL_NAME
              value: {{ .Values.ollama.model | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 5
          {{- if .Values.sections.model.enabled }}
          volumeMounts:
            - name: section-model
              mountPath: {{ .Values.sections.model.dir }}
              readOnly: true
          {{- end }}
      {{- if .Values.sections.model.enabled }}
      volumes:
        - name: section-model
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
{{- end }}
