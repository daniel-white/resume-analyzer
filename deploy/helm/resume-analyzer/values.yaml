api:
  # Off so `just dev` can bring the dependencies up without an image.
  # `just demo` turns it on after the bake.
  enabled: false
  image: resume-analyzer/api:dev
  pullPolicy: Never
  port: 8080
  # ClusterIP names for the Python fake, not a gateway route.
  # The host default is 127.0.0.1:8101-8107. `ATS_PROVIDERS=stub` is the
  # compiled stub. The callback has to be reachable from those pods.
  providers: "greenline=http://greenline:8080,levr=http://levr:8080,workdaye=http://workdaye:8080,ash=http://ash:8080,smart_resume=http://smart-resume:8080,indy_hackers_hiring=http://indy-hackers-hiring:8080,blast_track=http://blast-track:8080"
  callbackUrl: "http://api:8080"
  pluginSecret: "spine-stub-secret"

web:
  # Off for `just dev`. `just demo` bakes the image and turns this on,
  # so https://app.resume.local/ is the compiled web app.
  enabled: false
  image: resume-analyzer/web:dev
  pullPolicy: Never
  port: 3000

sections:
  # Baked BGE small ONNX files. An initContainer copies them into an emptyDir
  # so the API never downloads a model at startup. `SECTION_MODEL=off` falls
  # back to the deterministic heading aliases instead.
  model:
    enabled: true
    image: resume-analyzer/model:dev
    pullPolicy: Never
    dir: /models
    name: BAAI/bge-small-en-v1.5

# llama.cpp serves the candidate-profile model. The image is the official
# ghcr.io/ggml-org/llama.cpp:server build; the initContainer below downloads
# the GGUF into
# the PVC before the server starts, so a fresh pod serves it without a
# download while a resume uploads. A quantized 3B model answers in well under
# a second on one core, versus minutes for the Ollama build it replaces. The
# API reaches it in-cluster at llama-cpp:8080 on the OpenAI chat completions
# path. The worker still parses and stores a profile_summary row either way.
llama-cpp:
  enabled: true
  # The official llama.cpp server image, published on GHCR. It IS the server
  # (entrypoint /app/llama-server) and speaks the OpenAI chat completions API
  # on :8080. Verified end-to-end against a live model: /v1/chat/completions
  # returns choices[0].message.content exactly as the worker expects.
  # ggml-org/llama.cpp does not exist on Docker Hub - only on GHCR.
  image: ghcr.io/ggml-org/llama.cpp:server
  pullPolicy: IfNotPresent
  # The GGUF filename is also the model the server loads, so the container
  # args and the initContainer download target both use this value.
  model: llama-3.2-3b-instruct-q4_k_m.gguf
  # The GGUF the initContainer downloads before the server starts. The
  # quantized 3B file is ~2GB; the default keeps it out of the writable
  # layer and survives pod restarts.
  url: https://huggingface.co/hugging-quants/Llama-3.2-3B-Instruct-Q4_K_M-GGUF/resolve/main/llama-3.2-3b-instruct-q4_k_m.gguf
  storage: 3Gi

gateway:
  enabled: true
  mdns:
    enabled: true
    targetIp: 127.0.0.1
  tls:
    cert: ""
    key: ""

postgres:
  image: postgres:17-alpine
  user: resume
  password: resume
  database: resume

# ── pgAdmin (dev / debugging only) ────────────────────────────────────
#
# Browser UI for browsing the local Postgres. Served at
# https://tools.resume.local/pgadmin via the Envoy Gateway. The server entry is
# auto-configured from the ConfigMap in templates/pgadmin.yaml, so opening
# the UI lands you already connected to the `resume` database. Login is
# PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD below; the master
# password gate is skipped via PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=false,
# so saved-server passwords unlock without a separate prompt.
#
# Off by default — turn it on with `--set pgadmin.enabled=true`. The image
# is pulled at runtime like postgres:17-alpine; no sub-chart, no Helm-time
# dependency.
pgadmin:
  enabled: false
  image: docker.io/dpage/pgadmin4:latest
  port: 8080
  email: admin@resume.dev
  password: admin
  server:
    name: "Postgres (resume)"
    host: postgres
    port: 5432
    database: resume
    username: resume
    password: resume

localstack:
  image: localstack/localstack:4

mailpit:
  image: axllent/mailpit:v1.27

auth:
  # Demo cookie key. Replace it before this chart leaves a laptop.
  secret: dev-only-auth-secret-change-me

s3:
  bucket: resumes
  region: us-east-1
  accessKey: test
  secretKey: test
