api:
  # Off so `just dev` can bring the dependencies up without an image.
  # `just demo` turns it on after the bake.
  enabled: false
  image: resume-analyzer/api:dev
  pullPolicy: Never
  port: 8080
  # ClusterIP names for the Python fake, not a gateway route.
  # The host default is 127.0.0.1:8101-8107. `ATS_PROVIDERS=stub` is the
  # compiled stub. The callback has to be reachable from those pods.
  providers: "greenline=http://greenline:8080,levr=http://levr:8080,workdaye=http://workdaye:8080,ash=http://ash:8080,smart_resume=http://smart-resume:8080,indy_hackers_hiring=http://indy-hackers-hiring:8080,blast_track=http://blast-track:8080"
  callbackUrl: "http://api:8080"
  pluginSecret: "spine-stub-secret"

web:
  # Off for `just dev`. `just demo` bakes the image and turns this on,
  # so https://app.resume.local/ is the compiled web app.
  enabled: false
  image: resume-analyzer/web:dev
  pullPolicy: Never
  port: 3000

gateway:
  enabled: true
  mdns:
    enabled: true
    targetIp: 127.0.0.1
  tls:
    cert: ""
    key: ""

postgres:
  image: postgres:17-alpine
  user: resume
  password: resume
  database: resume

localstack:
  image: localstack/localstack:4

mailpit:
  image: axllent/mailpit:v1.27

auth:
  # Demo cookie key. Replace it before this chart leaves a laptop.
  secret: dev-only-auth-secret-change-me

s3:
  bucket: resumes
  region: us-east-1
  accessKey: test
  secretKey: test
